services:
  brouter-2016:
    build:
      context: ./code/pipeline_v2
      dockerfile: Dockerfile.brouter
    ports:
      - "17771:17777"
    volumes:
      - ./data/brouter/segments_2016:/brouter/segments4
      - ./data/brouter/brouter_bin:/brouter/bin
      - ./data/brouter/brouter_bin/profiles2:/brouter/profiles2
      - ./code/pipeline_v2/cycling_ci.brf:/brouter/profiles2/cycling_ci.brf
    environment:
      - JAVA_OPTS=-Xmx8G
      - BROUTER_JAR=/brouter/bin/brouter-server-1.7.8-all.jar
    command: [ "/brouter/segments4", "/brouter/profiles2", "/brouter/profiles2", "17777", "8", "0.0.0.0" ]

  brouter-2021:
