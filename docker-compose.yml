      - ./data/brouter/brouter_bin/profiles2:/brouter/profiles2
      - ./code/pipeline_v2/cycling_ci.brf:/brouter/profiles2/cycling_ci.brf
    environment:
      - JAVA_OPTS=-Xmx8G
